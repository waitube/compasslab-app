<title>컴패스랩</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=Gothic+A1:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 상단 아이 띠(이름·단계·성장 자) → 탭 → 한 칼럼 본문. 새싹 초록 잉크 + 돌잔치 금빛 이정표. */
:root{
  --bg:#f5f7f2; --sheet:#ffffff; --ink:#1d2a23; --ink2:#5b6a61; --line:#dde4dc;
  --leaf:#2e6a4c; --leaf-soft:#e3eee6; --gold:#c9932b; --gold-soft:#f8eed7;
  --rose:#b5463a; --rose-soft:#f7e3df; --sky:#2f5f8a; --sky-soft:#e2ebf4;
  --mok:#3f7d4e; --hwa:#c0412f; --to:#a07a2c; --geum:#6f7378; --su:#26406b;
  --f-display:"Hahmlet","Noto Serif KR",serif;
  --f-body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --sheet:#1a221e; --ink:#e6ece8; --ink2:#9db0a5; --line:#2c3832;
  --leaf:#79c39b; --leaf-soft:#1f3328; --gold:#e3b558; --gold-soft:#3a3020;
  --rose:#e88274; --rose-soft:#3b2421; --sky:#8fb6dd; --sky-soft:#1e2c3a;
  --mok:#7cc08f; --hwa:#e97f6c; --to:#d6ae5e; --geum:#b0b6bb; --su:#93acd9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --sheet:#1a221e; --ink:#e6ece8; --ink2:#9db0a5; --line:#2c3832;
  --leaf:#79c39b; --leaf-soft:#1f3328; --gold:#e3b558; --gold-soft:#3a3020;
  --rose:#e88274; --rose-soft:#3b2421; --sky:#8fb6dd; --sky-soft:#1e2c3a;
  --mok:#7cc08f; --hwa:#e97f6c; --to:#d6ae5e; --geum:#b0b6bb; --su:#93acd9; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:1.6rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink2)} .small{font-size:.86rem}
.label{font-size:.75rem;letter-spacing:.08em;color:var(--ink2);font-weight:700}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row>*{min-width:0}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;min-height:54px;padding-block:6px}
.brand{font-family:var(--f-display);font-weight:700;color:var(--leaf);white-space:nowrap}
.kids{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.kids::-webkit-scrollbar{display:none}
.kid{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:5px 12px;white-space:nowrap;cursor:pointer}
.kid[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:var(--sheet);font-weight:700}
.kid.add{border-style:dashed;color:var(--ink2)}
.sync{border:1px solid var(--line);background:var(--sheet);color:var(--ink2);border-radius:999px;padding:4px 10px;font-size:.78rem;white-space:nowrap;cursor:pointer}
.sync.on{border-color:var(--leaf);color:var(--leaf)} .sync.err{border-color:var(--gold);color:var(--gold)}
.acct{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.acct form{display:flex;flex-direction:column;gap:10px}
.consent{display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.consent label{display:flex;gap:8px;align-items:flex-start}
.err-msg{color:var(--gold);font-size:.88rem}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line)}
nav.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px;white-space:nowrap;cursor:pointer;color:var(--ink2);border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--gold)}

main{padding-block:20px 72px;display:flex;flex-direction:column;gap:20px}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:18px}
.btn{border:1px solid var(--line);background:var(--sheet);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--leaf)}
.btn.primary{background:var(--leaf);border-color:var(--leaf);color:var(--sheet);font-weight:700}
.btn.ghost{border-color:transparent;background:none;color:var(--leaf);padding-inline:6px}
.btn.small{padding:5px 10px;font-size:.85rem}
.pill{display:inline-block;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap}
.p-now{background:var(--gold-soft);color:var(--gold)} .p-soon{background:var(--sky-soft);color:var(--sky)}
.p-past{background:var(--line);color:var(--ink2)} .p-done{background:var(--leaf-soft);color:var(--leaf)}
.p-warn{background:var(--rose-soft);color:var(--rose)} .p-ex{background:var(--gold-soft);color:var(--gold)}
.notice{border-left:3px solid var(--gold);background:var(--gold-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:.88rem}
.empty{padding:22px;text-align:center;color:var(--ink2);border:1px dashed var(--line);border-radius:14px}

/* 아이 띠 */
.hero .who{display:flex;flex-direction:column;gap:2px;min-width:0}
.age{font-family:var(--f-num)}
/* 평생 이정표: 출생 → 돌 → 유치원 → 초등 → 중학교 → 고등학교 → 대학·사회, 같은 간격 + 지금 구간 안에서 비율 */
.hero-card{display:flex;flex-direction:column;gap:18px;padding:22px;background:linear-gradient(160deg,var(--leaf-soft) 0%,var(--sheet) 55%)}
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}
.stage-line{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.stage-name{font-family:var(--f-display);font-size:clamp(1.9rem,6vw,2.6rem);font-weight:700;color:var(--leaf);line-height:1.1;letter-spacing:-.01em}
.grade{font-size:1rem;font-weight:500;color:var(--leaf);background:var(--sheet);border:1px solid var(--leaf);border-radius:999px;padding:2px 10px}
.focus-line{margin:4px 0 0;color:var(--ink2);font-size:.92rem}
.next-card{display:flex;flex-direction:column;align-items:flex-end;gap:1px;text-align:right;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:120px}
.next-card b{font-family:var(--f-display);font-size:1rem}
.dday{font-size:1.6rem;font-weight:500;color:var(--gold);line-height:1.1}
.path{position:relative;height:84px;margin:4px 6px 0}
.track{position:absolute;left:0;right:0;top:34px;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.track-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--leaf),color-mix(in srgb,var(--leaf) 70%,var(--gold)))}
.you{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;z-index:2;pointer-events:none}
.you span{background:var(--gold);color:var(--sheet);font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.you::after{content:"";width:2px;height:14px;background:var(--gold)}
.stop{position:absolute;top:29px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;white-space:nowrap;background:none;border:0;padding:0;font:inherit;cursor:pointer;color:inherit}
.stop:hover .stop-name{color:var(--leaf);text-decoration:underline}
.stop.sel i{box-shadow:0 0 0 4px color-mix(in srgb,var(--leaf) 30%,transparent)} .stop.sel .stop-name{color:var(--leaf);font-weight:700}
.stop i{width:18px;height:18px;border-radius:50%;background:var(--sheet);border:3px solid var(--line);box-sizing:border-box}
.stop.done i{background:var(--leaf);border-color:var(--leaf)}
.stop.next i{border-color:var(--gold);background:var(--gold-soft);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 22%,transparent)}
.stop-name{font-size:.74rem;color:var(--ink2)} .stop.next .stop-name{color:var(--ink);font-weight:700}
.stop-date{font-size:.66rem;color:var(--ink2);opacity:.8}
.stop-name .short{display:none}
.stop:first-of-type{transform:translateX(-9px);align-items:flex-start} .stop:last-of-type{transform:translateX(calc(-100% + 9px));align-items:flex-end}
.focus-links{display:flex;flex-wrap:wrap;gap:8px}
.path-hint{margin:-8px 0 0}
.period-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.period-stats div{background:var(--bg);border-radius:10px;padding:10px;display:flex;flex-direction:column;align-items:center}
.period-stats b{font-size:1.5rem;color:var(--leaf);line-height:1.2} .period-stats span{font-size:.8rem;color:var(--ink2)}
.grp-title{font-size:.95rem;margin-top:6px}
.done-on{color:var(--leaf);font-weight:500}
.note{display:grid;grid-template-columns:auto auto 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.note:last-child{border-bottom:0} .note-date{font-size:.8rem;color:var(--ink2)} .note-text{min-width:0;overflow-wrap:anywhere}
.note-form{display:grid;grid-template-columns:auto auto 1fr auto;gap:8px}
.note-form input,.note-form select{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--bg);color:var(--ink);font:inherit;min-width:0}
details.panel summary{cursor:pointer}
@media (max-width:560px){ .note-form{grid-template-columns:1fr 1fr} .note-form #n-text{grid-column:1/-1} .note-form button{grid-column:1/-1} .note{grid-template-columns:auto 1fr auto} .note .pill{display:none} }
.focus-link{display:inline-flex;align-items:center;gap:4px;padding:7px 12px;border-radius:999px;background:var(--sheet);border:1px solid var(--line);color:var(--leaf);font-size:.85rem;font-weight:500;text-decoration:none}
.focus-link:hover{border-color:var(--leaf)}
@media (max-width:520px){ .hero{grid-template-columns:1fr} .next-card{text-align:left;flex-direction:row;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
  .stop-date{display:none} .stop-name{font-size:.68rem} .stop-name .long{display:none} .stop-name .short{display:inline} .path{height:72px} }
@media (prefers-reduced-motion:no-preference){ .track-fill{transition:width .6s ease} }

/* 할 일 */
.task{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.task:last-child{border-bottom:0}
.task input{width:20px;height:20px;accent-color:var(--leaf);margin-top:2px}
.task .t{font-weight:700} .task .d{grid-column:2/4;font-size:.86rem;color:var(--ink2)}
.task.is-done .t{text-decoration:line-through;color:var(--ink2)}
.cat{font-size:.72rem;color:var(--ink2);margin-left:6px;font-weight:500}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--sheet);padding:5px 12px;border-radius:999px;cursor:pointer;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}

/* 성향 */
.areas{display:grid;gap:10px}
.area{display:grid;grid-template-columns:96px 1fr 44px;gap:10px;align-items:center;font-size:.9rem}
.track{position:relative;height:10px;background:var(--line);border-radius:5px}
.track .base{position:absolute;top:-3px;width:2px;height:16px;background:var(--ink2)}
.track .ans{position:absolute;left:0;top:0;height:10px;border-radius:5px;background:var(--leaf)}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--ink2)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--leaf)}
.legend span.b::before{width:2px;background:var(--ink2)}
.q{padding:12px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale label{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border:1px solid var(--line);border-radius:9px;cursor:pointer;font-size:.7rem;color:var(--ink2);text-align:center;line-height:1.2}
.scale input{position:absolute;opacity:0;pointer-events:none}
.scale b{font-size:.95rem;color:var(--ink)}
.scale label:has(input:checked){border-color:var(--leaf);background:var(--leaf-soft);color:var(--leaf)}
.scale label:has(input:focus-visible){outline:2px solid var(--gold)}
.recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.rec{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--sheet)}
.rec h3{font-size:1rem}

/* 기관 체크 */
.ck{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.tri{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tri button{border:0;background:none;padding:5px 9px;font-size:.78rem;cursor:pointer;color:var(--ink2)}
.tri button[aria-pressed="true"]{background:var(--leaf);color:var(--sheet);font-weight:700}
.tri button.need[aria-pressed="true"]{background:var(--rose)}
.grp-hot{color:var(--gold);font-size:.75rem;font-weight:700;margin-left:6px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--bg);color:var(--ink2);font-weight:700;white-space:nowrap}

/* 심명 보기 */
.pillars{display:flex;gap:8px;flex-wrap:wrap}
.pil{border:1px solid var(--line);border-radius:10px;padding:8px 12px;text-align:center;min-width:62px}
.pil .gz{font-family:var(--f-display);font-size:1.6rem;line-height:1.15}
.pil .lb{font-size:.7rem;color:var(--ink2)}
.gods{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.god{border-radius:10px;padding:10px;text-align:center;border:1px solid var(--line)}
.god b{display:block;font-family:var(--f-display);font-size:1.4rem}
.e-목{color:var(--mok)}.e-화{color:var(--hwa)}.e-토{color:var(--to)}.e-금{color:var(--geum)}.e-수{color:var(--su)}
.months{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mo{border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;font-size:.78rem;display:flex;flex-direction:column;gap:2px}
.mo .gz{font-family:var(--f-display);font-size:1.05rem}
.mo.r-YONGSIN,.mo.r-HUISIN{background:var(--leaf-soft);border-color:var(--leaf)}
.mo.r-BYEONGSIN{background:var(--rose-soft);border-color:var(--rose)}
.mo.now{outline:2px solid var(--gold)}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:.9rem}
.switch input{width:38px;height:22px;accent-color:var(--leaf)}

/* 폼 */
form.child{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--ink2);min-width:0}
.fld input,.fld select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.link{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:12px;padding:14px;text-decoration:none;color:var(--ink);background:var(--sheet)}
.link:hover{border-color:var(--leaf)}
.link b{font-family:var(--f-display)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:10px 16px;border-radius:10px;font-size:.88rem;z-index:20}
footer{font-size:.78rem;color:var(--ink2);border-top:1px solid var(--line);padding-top:14px}
@media (max-width:560px){.stage-name{font-size:1.7rem}.months{grid-template-columns:repeat(4,1fr)}.gods{grid-template-columns:repeat(2,1fr)}.area{grid-template-columns:78px 1fr 38px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="wrap top-in">
    <span class="brand">컴패스랩</span>
    <button class="sync" id="syncPill" data-tab="account" hidden></button>
    <div class="kids" id="kids" role="group" aria-label="아이 선택"></div>
  </div>
  <div class="wrap"><nav class="tabs" id="tabs" role="tablist"></nav></div>
</header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script>/* engine/saju-core.js */
/* ============================================================
   saju-core.js — 사주코어 계산 엔진 (순수 로직, DOM 의존 없음)
   -------------------------------------------------------------
   와이튜브 "평생 사주 기반 인생 설계" 플랫폼의 공통 엔진.
   이 파일 하나만 불러오면 아래 함수/데이터를 어느 화면에서든
   재사용할 수 있습니다 (예: 대학매칭 페이지, 진로리포트 페이지 등).

   사용법 (브라우저):
     <script src="saju-core.js"><\/script>
     <script>
       const saju = SajuCore.computeSaju(1974,4,10,23,40,true,'M');
       const ys   = SajuCore.computeYongsin(saju, true);
       console.log(ys.yongsin, ys.huisin, ys.gisin, ys.gusin);
     <\/script>

   * 원본 saju-core.html에서 계산 로직을 옮긴 공통 엔진입니다.
   * 통일본 v2026.11.07b (SCM·gunghapcore·평생앱 공용) — 아래 항목이 확정 반영됨
     ① 자시는 정자시로 고정 (23:30부터 다음날 일주, jasiMode 인자는 무시)
     ② 시지는 한국 표준시 30분 보정 (자시 23:30~01:29 … 해시 21:30~23:29)
     ③ 희신 = 용신을 생하는 오행 (whoGenerates(yongsin))
     ④ 신약 + 관성이 최강 오행이면 비겁(일간 오행)을 용신으로 (통관보다 우선)
     ⑤ 서머타임·표준시 변경 보정 (1948~51, 1955~60, 1987~88 서머타임 / 1954.3~1961.8 UTC+8:30)
        → 입력은 "그때 시계가 가리킨 시각". 엔진이 동경135도(UTC+9) 기준 시각으로 바꾼 뒤 계산 (2026.11.07 확정)
     ⑥ 흐르는 운(대운·세운)의 십신·용신 판정은 지지 기준. 원국은 일간 기준 유지 (2026.11.07 확정)
     이 파일을 고칠 때는 모든 저장소의 사본을 같이 갱신하세요.
   ============================================================ */

/* ===================== 기초 데이터 ===================== */
const STEMS = ["갑","을","병","정","무","기","경","신","임","계"];
const STEMS_HAN = ["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];

function gzFromIndex(idx){
  idx = ((idx % 60) + 60) % 60;
  return { stem: idx % 10, branch: idx % 12 };
}
function findGZIndex(stem, branch){
  for(let n=0;n<60;n++){ if(n%10===stem && n%12===branch) return n; }
  return -1;
}

/* ===================== 천문 계산 ===================== */
function toJD(y, m, d, h){ // h = UT decimal hours
  if(m<=2){ y-=1; m+=12; }
  const A = Math.floor(y/100);
  const B = 2 - A + Math.floor(A/4);
  return Math.floor(365.25*(y+4716)) + Math.floor(30.6001*(m+1)) + d + h/24 + B - 1524.5;
}
function solarLongitude(jd){
  const T = (jd - 2451545.0) / 36525;
  const L0 = 280.46646 + 36000.76983*T + 0.0003032*T*T;
  const M  = 357.52911 + 35999.05029*T - 0.0001537*T*T;
  const Mr = M*Math.PI/180;
  const C = (1.914602 - 0.004817*T - 0.000014*T*T)*Math.sin(Mr)
          + (0.019993 - 0.000101*T)*Math.sin(2*Mr)
          + 0.000289*Math.sin(3*Mr);
  const trueLong = L0 + C;
  const omega = 125.04 - 1934.136*T;
  let apparent = trueLong - 0.00569 - 0.00478*Math.sin(omega*Math.PI/180);
  apparent = ((apparent % 360)+360)%360;
  return apparent;
}
function findTermJD(guessJD, targetDeg){
  let lo = guessJD-10, hi = guessJD+10;
  function f(jd){
    let diff = solarLongitude(jd) - targetDeg;
    if(diff>180) diff-=360;
    if(diff<-180) diff+=360;
    return diff;
  }
  let flo = f(lo);
  for(let i=0;i<60;i++){
    const mid=(lo+hi)/2, fm=f(mid);
    if((flo<0 && fm<0) || (flo>0 && fm>0)){ lo=mid; flo=fm; } else { hi=mid; }
  }
  return (lo+hi)/2;
}
// 12 절(節) 정의: [황경, 근사월, 근사일, 시작월지]
const JEOL_DEFS = [
  {deg:315, m:2,  d:4,  branch:2},  // 입춘 -> 인월
  {deg:345, m:3,  d:6,  branch:3},  // 경칩 -> 묘월
  {deg:15,  m:4,  d:5,  branch:4},  // 청명 -> 진월
  {deg:45,  m:5,  d:6,  branch:5},  // 입하 -> 사월
  {deg:75,  m:6,  d:6,  branch:6},  // 망종 -> 오월
  {deg:105, m:7,  d:7,  branch:7},  // 소서 -> 미월
  {deg:135, m:8,  d:8,  branch:8},  // 입추 -> 신월
  {deg:165, m:9,  d:8,  branch:9},  // 백로 -> 유월
  {deg:195, m:10, d:8,  branch:10}, // 한로 -> 술월
  {deg:225, m:11, d:7,  branch:11}, // 입동 -> 해월
  {deg:255, m:12, d:7,  branch:0},  // 대설 -> 자월
  {deg:285, m:1,  d:6,  branch:1},  // 소한 -> 축월
];
function computeJeolTerms(centerYear){
  const terms = [];
  for(const yr of [centerYear-1, centerYear, centerYear+1]){
    for(const def of JEOL_DEFS){
      const guess = toJD(yr, def.m, def.d, -9); // KST->UT 근사 보정한 자정 근처
      const jd = findTermJD(guess, def.deg);
      terms.push({jd, branch:def.branch});
    }
  }
  terms.sort((a,b)=>a.jd-b.jd);
  return terms;
}

/* ===================== 서머타임·표준시 보정 ===================== */
// 한국(Asia/Seoul) UTC 오프셋 변경 이력 — IANA 시간대 데이터베이스에서 추출. [변경 시각(UTC), 이후 오프셋(분)]
const SEOUL_OFFSETS = [
  ["1948-05-31T15:00Z",600],["1948-09-12T14:00Z",540],["1949-04-02T15:00Z",600],["1949-09-10T14:00Z",540],
  ["1950-03-31T15:00Z",600],["1950-09-09T14:00Z",540],["1951-05-05T15:00Z",600],["1951-09-08T14:00Z",540],
  ["1954-03-20T15:00Z",510],["1955-05-04T15:30Z",570],["1955-09-08T14:30Z",510],["1956-05-19T15:30Z",570],
  ["1956-09-29T14:30Z",510],["1957-05-04T15:30Z",570],["1957-09-21T14:30Z",510],["1958-05-03T15:30Z",570],
  ["1958-09-20T14:30Z",510],["1959-05-02T15:30Z",570],["1959-09-19T14:30Z",510],["1960-04-30T15:30Z",570],
  ["1960-09-17T14:30Z",510],["1961-08-09T15:30Z",540],["1987-05-09T17:00Z",600],["1987-10-10T17:00Z",540],
  ["1988-05-07T17:00Z",600],["1988-10-08T17:00Z",540]
].map(([t,o])=>[Date.parse(t),o]);
function seoulOffsetAt(utcMs){
  let off = 540;
  for(const [t,o] of SEOUL_OFFSETS){ if(utcMs >= t) off = o; else break; }
  return off;
}
/** 시계 시각(그 시절 한국 시계) → 동경135도(UTC+9) 기준 시각. 서머타임·UTC+8:30 시기를 반영 */
function normalizeToKST(y,m,d,hour,minute){
  const wall = Date.UTC(y,m-1,d,hour,minute);
  let utc = wall - 540*60000;
  for(let i=0;i<3;i++){ const off=seoulOffsetAt(utc); const next = wall - off*60000; if(next===utc) break; utc = next; }
  const offsetMin = seoulOffsetAt(utc);
  const k = new Date(utc + 540*60000);
  let note = "";
  if(offsetMin===600) note = "서머타임 시기 — 시계 시각에서 1시간을 빼서 계산";
  else if(offsetMin===570) note = "서머타임 시기(당시 표준시 UTC+8:30) — 동경135도 기준으로 30분을 더해 계산";
  else if(offsetMin===510) note = "당시 표준시 UTC+8:30 — 동경135도 기준으로 30분을 더해 계산";
  return { y:k.getUTCFullYear(), m:k.getUTCMonth()+1, d:k.getUTCDate(), hour:k.getUTCHours(), minute:k.getUTCMinutes(), offsetMin, note };
}

/* ===================== 사주 계산 ===================== */
function addOneDay(y,m,d){
  const dt = new Date(Date.UTC(y, m-1, d));
  dt.setUTCDate(dt.getUTCDate()+1);
  return { y: dt.getUTCFullYear(), m: dt.getUTCMonth()+1, d: dt.getUTCDate() };
}
function computeSaju(y,m,d,hour,minute,hasTime,gender,jasiMode){
  // 서머타임·옛 표준시 보정: 입력(그때의 시계 시각)을 동경135도(UTC+9) 기준 시각으로 바꾼다
  // jasiMode === 'kst' 이면 호출하는 쪽이 이미 UTC+9 표준시로 바꿔서 넘긴 것이므로 다시 보정하지 않는다
  let timeCorrection = { offsetMin: 540, note: "" };
  if(hasTime && jasiMode !== 'kst'){
    const k = normalizeToKST(y,m,d,hour,minute);
    timeCorrection = { offsetMin: k.offsetMin, note: k.note, input: {y,m,d,hour,minute} };
    y=k.y; m=k.m; d=k.d; hour=k.hour; minute=k.minute;
  }
  const utHour = hour + minute/60 - 9; // KST -> UT
  const birthJD = toJD(y,m,d, utHour);

  // 일주 계산용 날짜 — 대표님 고유 이론: 정자시로 고정
  // 23:30부터 이미 다음날로 취급 → 하루를 당겨서 계산 (jasiMode 인자는 호환용으로만 받고 무시)
  jasiMode = 'unified';
  let dayCalcDate = {y,m,d};
  if(hasTime && (hour===23 && minute>=30)){
    dayCalcDate = addOneDay(y,m,d);
  }

  const terms = computeJeolTerms(y);
  // 현재 절(월주 결정) : birthJD 이하 중 가장 늦은 term
  let curIdx = -1;
  for(let i=0;i<terms.length;i++){ if(terms[i].jd<=birthJD) curIdx=i; }
  const monthBranch = terms[curIdx].branch;
  const monthStartJD = terms[curIdx].jd;
  const nextTermJD = terms[curIdx+1].jd;
  const prevTermJD = curIdx>0 ? terms[curIdx-1].jd : terms[curIdx].jd;

  // 입춘 기준 연주(year pillar)
  const ipchunGuess = toJD(y,2,4,-9);
  const ipchunJD = findTermJD(ipchunGuess, 315);
  const sajuYear = birthJD < ipchunJD ? y-1 : y;
  const yearIdx = ((sajuYear-4)%60+60)%60;
  const yearStem = yearIdx%10, yearBranch = yearIdx%12;

  // 월주
  const baseStemArr = [2,4,6,8,0];
  const monthsSinceYin = (monthBranch-2+12)%12;
  const monthStem = (baseStemArr[yearStem%5] + monthsSinceYin)%10;

  // 일주 (일주는 해당 지역 달력일 자체에 대응하므로 시간대 보정 없이 계산)
  const JDN = Math.floor(toJD(dayCalcDate.y,dayCalcDate.m,dayCalcDate.d,12));
  const dayIdx = ((JDN+49)%60+60)%60;
  const dayStem = dayIdx%10, dayBranch = dayIdx%12;

  // 시주
  let hourStem=null, hourBranch=null;
  if(hasTime){
    // 한국 표준시(동경 135도)는 실제 태양시보다 약 30분 빠르므로 30분을 보정해 시지를 정합니다.
    // 자시 23:30~01:29, 축시 01:30~03:29 … 술시 19:30~21:29, 해시 21:30~23:29
    // (날짜가 23:30에 넘어가는 정자시 기준과도 맞춰짐)
    const solarMin = ((hour*60 + minute - 30) % 1440 + 1440) % 1440;
    hourBranch = Math.floor(((solarMin + 60) % 1440) / 120);
    const hbaseArr=[0,2,4,6,8];
    hourStem = (hbaseArr[dayStem%5] + hourBranch)%10;
  }

  // 대운
  const isYangYear = (yearStem%2===0);
  const forward = (isYangYear && gender==='M') || (!isYangYear && gender==='F');
  const daysDiff = forward ? (nextTermJD - birthJD) : (birthJD - monthStartJD);
  const dwStartAgeExact = daysDiff/3;
  const dwStartAge = Math.max(1, Math.round(dwStartAgeExact));
  const monthGZIndex = findGZIndex(monthStem, monthBranch);
  const daewoon = [];
  for(let k=1;k<=9;k++){
    const idx = ((monthGZIndex + (forward?1:-1)*k)%60+60)%60;
    daewoon.push({ idx, startAge: dwStartAge + 10*(k-1) });
  }

  return {
    year:{stem:yearStem,branch:yearBranch},
    month:{stem:monthStem,branch:monthBranch},
    day:{stem:dayStem,branch:dayBranch},
    hour: hasTime ? {stem:hourStem,branch:hourBranch} : null,
    sajuYear, forward, dwStartAge, dwStartAgeExact, daewoon,
    birthYear: y, jasiMode, timeCorrection
  };
}

/* ===================== 용신 분석 (억부·조후·통관·병약 고전이론) ===================== */
// 오행 상생: A가 B를 낳음 / 상극: A가 B를 제어함 (전통 명리학 공개 이론)
const GENERATES = {"목":"화","화":"토","토":"금","금":"수","수":"목"};
const CONTROLS  = {"목":"토","화":"금","토":"수","금":"목","수":"화"};
function whoGenerates(target){ return Object.keys(GENERATES).find(k=>GENERATES[k]===target); } // target을 낳아주는 오행 (인성)
function whoControls(target){ return Object.keys(CONTROLS).find(k=>CONTROLS[k]===target); }   // target을 극하는 오행

function seasonOf(monthBranch){
  // 인묘진=봄(목), 사오미=여름(화), 신유술=가을(금), 해자축=겨울(수)
  if([2,3,4].includes(monthBranch)) return "봄";
  if([5,6,7].includes(monthBranch)) return "여름";
  if([8,9,10].includes(monthBranch)) return "가을";
  return "겨울";
}

// 삼합(三合): 지지 세 글자가 모이면 하나의 오행 기운으로 응축됨 (왕지 포함 2개만 모이면 반합)
const SAMHAP = [
  { branches:[11,3,7], elem:"목", king:3,  label:"해묘미(亥卯未)" },
  { branches:[2,6,10], elem:"화", king:6,  label:"인오술(寅午戌)" },
  { branches:[5,9,1],  elem:"금", king:9,  label:"사유축(巳酉丑)" },
  { branches:[8,0,4],  elem:"수", king:0,  label:"신자진(申子辰)" },
];
// 충(沖): 마주보는 지지끼리 부딪혀 합의 효력을 약화시킴
const CHUNG_PAIRS = [[0,6],[1,7],[2,8],[3,9],[4,10],[5,11]];
function chungPartner(branch){
  const pair = CHUNG_PAIRS.find(p=>p.includes(branch));
  return pair ? pair.find(b=>b!==branch) : null;
}

function detectSamhap(branchPositions){
  // branchPositions: [{branch, label}] (년/월/일/시)
  const presentBranches = branchPositions.map(p=>p.branch);
  const bonus = {"목":0,"화":0,"토":0,"금":0,"수":0};
  const notes = [];
  for(const def of SAMHAP){
    const matched = def.branches.filter(b=>presentBranches.includes(b));
    if(matched.length===3){
      let strength = 1.0, weakenNote = "";
      // 충으로 약화되는지 확인
      const broken = matched.some(b=>presentBranches.includes(chungPartner(b)));
      if(broken){ strength = 0.5; weakenNote = " (단, 충 관계가 함께 있어 결합력이 절반으로 약화됨)"; }
      matched.forEach(()=>{ bonus[def.elem]+=strength; });
      notes.push(`삼합 성립: ${def.label} → ${def.elem} 기운 응축${weakenNote}`);
    } else if(matched.length===2 && matched.includes(def.king)){
      let strength = 0.5, weakenNote = "";
      const broken = matched.some(b=>presentBranches.includes(chungPartner(b)));
      if(broken){ strength = 0.25; weakenNote = " (충으로 결합력 약화)"; }
      matched.forEach(()=>{ bonus[def.elem]+=strength; });
      notes.push(`반합 성립: ${def.label} 중 ${matched.length}자 → ${def.elem} 기운 일부 가세${weakenNote}`);
    }
  }
  return { bonus, notes };
}

// 육합(六合): 지지 두 글자가 짝을 이루면 삼합보다 약한 결합력으로 오행이 발생 (오미합은 오행 생성 불명확한 특수합)
const YUKHAP = [
  { pair:[0,1], elem:"토", label:"자축합(子丑合)" },
  { pair:[2,11], elem:"목", label:"인해합(寅亥合)" },
  { pair:[3,10], elem:"화", label:"묘술합(卯戌合)" },
  { pair:[4,9], elem:"금", label:"진유합(辰酉合)" },
  { pair:[5,8], elem:"수", label:"사신합(巳申合)" },
  { pair:[6,7], elem:null, label:"오미합(午未合, 오행 생성 불명확한 특수합)" },
];
function detectYukhap(branchPositions){
  const presentBranches = branchPositions.map(p=>p.branch);
  const bonus = {"목":0,"화":0,"토":0,"금":0,"수":0};
  const notes = [];
  for(const def of YUKHAP){
    const [a,b] = def.pair;
    if(presentBranches.includes(a) && presentBranches.includes(b)){
      let strength = 0.3, weakenNote = "";
      const broken = presentBranches.includes(chungPartner(a)) || presentBranches.includes(chungPartner(b));
      if(broken){ strength = 0.15; weakenNote = " (충으로 결합력 약화)"; }
      if(def.elem){ bonus[def.elem]+=strength; notes.push(`육합 성립: ${def.label} → ${def.elem} 기운 소폭 가세${weakenNote}`); }
      else { notes.push(`육합 성립: ${def.label}${weakenNote}`); }
    }
  }
  return { bonus, notes };
}

function computeYongsin(saju, hasTime){
  const counts = {"목":0,"화":0,"토":0,"금":0,"수":0};
  counts[STEM_ELEM[saju.year.stem]]++;
  counts[STEM_ELEM[saju.month.stem]]++;
  counts[STEM_ELEM[saju.day.stem]]++;
  if(hasTime) counts[STEM_ELEM[saju.hour.stem]]++;
  counts[BRANCH_ELEM[saju.year.branch]]++;
  counts[BRANCH_ELEM[saju.month.branch]] += 2; // 월지는 계절의 사령이므로 가중치 2 (득령 개념)
  counts[BRANCH_ELEM[saju.day.branch]]++;
  if(hasTime) counts[BRANCH_ELEM[saju.hour.branch]]++;

  // 삼합/반합 보정
  const branchPositions = [
    {branch:saju.year.branch}, {branch:saju.month.branch}, {branch:saju.day.branch}
  ];
  if(hasTime) branchPositions.push({branch:saju.hour.branch});
  const samhap = detectSamhap(branchPositions);
  for(const el of Object.keys(counts)){ counts[el] += samhap.bonus[el]; }
  const yukhap = detectYukhap(branchPositions);
  for(const el of Object.keys(counts)){ counts[el] += yukhap.bonus[el]; }

  const total = Object.values(counts).reduce((a,b)=>a+b,0);
  const dayElem = STEM_ELEM[saju.day.stem];       // 일간 오행 = 비겁
  const inseongElem = whoGenerates(dayElem);       // 일간을 생하는 오행 = 인성

  const group1 = counts[dayElem] + counts[inseongElem]; // 비겁+인성 (신강 세력)
  const group2 = total - group1;                        // 식상+재성+관성 (신약 세력 유발)
  const isStrong = group1 > group2;

  const sortedElems = Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  const strongest = sortedElems[0];
  const secondStrongest = sortedElems[1];
  const weakest = sortedElems[sortedElems.length-1];

  // ---- 통관(通關) 판단: 1·2위 오행이 상극 관계이면서 세력 차이가 크지 않을 때 ----
  let tonggwan = null;
  const gap = counts[strongest] - counts[secondStrongest];
  const isConflict = (CONTROLS[strongest]===secondStrongest) || (CONTROLS[secondStrongest]===strongest);
  if(isConflict && gap <= 1.5 && counts[secondStrongest] > 0){
    const [A,B] = CONTROLS[strongest]===secondStrongest ? [strongest, secondStrongest] : [secondStrongest, strongest];
    const mediator = GENERATES[A]; // A생B의 다리 역할 (A생M, M생B)
    tonggwan = { A, B, mediator, note: `${A}(${counts[A]})과 ${B}(${counts[B]})가 팽팽히 상극하고 있어, ${mediator} 기운이 둘을 중재하는 통관용신 후보가 됩니다.` };
  }

  // ---- 억부용신 산출 ----
  // 대표님 이론(2026.11.07 확정): 신약 사주에서 가장 강한 오행이 관성(일간을 극하는 오행)이면,
  // 그 관성에 눌려 약해진 일간 오행(비겁)을 용신으로, 그것을 생하는 인성을 희신으로 삼는다.
  // 이 판단은 통관보다 우선한다. (예: 1974.4.10 23:40 임수 일간, 토 최강 → 용신 수·희신 금)
  const gwanElem = whoControls(dayElem);
  let yongsin, reason;
  if(!isStrong && strongest === gwanElem){
    yongsin = dayElem;
    reason = `신약 사주 — 가장 강한 ${strongest}(관성)이 일간 ${dayElem}을 극해 약하게 만들고 있으므로, 눌린 ${dayElem}(비겁)을 용신으로 삼아 직접 힘을 세웁니다.`;
  } else if(tonggwan && counts[tonggwan.mediator] > 0){
    yongsin = tonggwan.mediator;
    reason = `통관 우선 — ${tonggwan.note}`;
  } else if(isStrong){
    const controller = whoControls(strongest);
    if(counts[controller] > 0){
      yongsin = controller;
      reason = `신강 사주 — 가장 강한 ${strongest} 기운을 직접 제어하는 ${controller} 기운을 억부용신으로 삼습니다.`;
    } else {
      yongsin = GENERATES[strongest];
      reason = `신강 사주이나 ${strongest}을 극하는 오행이 원국에 없어, 대신 ${strongest}의 기운을 자연스럽게 빼주는(설기) ${GENERATES[strongest]} 기운을 용신으로 삼습니다.`;
    }
  } else {
    if(counts[inseongElem] > 0){
      yongsin = inseongElem;
      reason = `신약 사주 — 일간을 생조하는 인성(${inseongElem}) 기운으로 힘을 보강합니다.`;
    } else {
      yongsin = dayElem;
      reason = `신약 사주이나 인성(${inseongElem})이 원국에 없어, 비겁(${dayElem})으로 직접 힘을 보강합니다.`;
    }
  }

  // ---- 희신/병신/약신: 용신 중심 4신 체계 (희신=용신을 생함, 병신=용신을 극함, 약신=병신을 극함) ----
  const huisin = whoGenerates(yongsin);     // 용신을 생하는 오행 = 희신
  const gisin = whoControls(yongsin);       // 용신을 극하는 오행 = 병신
  const gusin = whoControls(gisin);         // 병신을 극하는 오행 = 약신

  // ---- 병약(病藥) 판단: 용신이 실제로 원국 내에서 공격받고 있는가 ----
  let byeongyak = null;
  if(counts[gisin] >= counts[yongsin] && counts[gisin] > 0){
    byeongyak = {
      byeong: gisin, yak: gusin,
      note: `용신(${yongsin})보다 이를 공격하는 병신(${gisin})의 세력이 더 강해 '병(病)'이 든 상태입니다. 병신을 제어하는 ${gusin} 기운이 '약(藥)'의 역할을 해야 합니다.`
    };
  }

  // ---- 조후 참고 ----
  const season = seasonOf(saju.month.branch);
  let johuNote = "";
  if((season==="여름") && (dayElem==="화" || counts["화"]>=3)){
    johuNote = "여름 출생에 화 기운까지 강해 사주가 뜨겁습니다. 수(水) 기운으로 식혀주는 조후가 함께 필요합니다.";
  } else if((season==="겨울") && (dayElem==="수" || counts["수"]>=3)){
    johuNote = "겨울 출생에 수 기운까지 강해 사주가 차갑습니다. 화(火) 기운으로 데워주는 조후가 함께 필요합니다.";
  } else if(season==="여름"){
    johuNote = "여름 출생이라 사주가 전반적으로 건조·고온한 경향이 있어, 수 기운의 존재 여부를 함께 살펴보면 좋습니다.";
  } else if(season==="겨울"){
    johuNote = "겨울 출생이라 사주가 전반적으로 한랭한 경향이 있어, 화 기운의 존재 여부를 함께 살펴보면 좋습니다.";
  }

  return {
    counts, total, isStrong, group1, group2, strongest, weakest,
    yongsin, reason, huisin, gisin, gusin, tonggwan, byeongyak,
    samhapNotes: samhap.notes.concat(yukhap.notes), season, johuNote
  };
}

/* ===================== 대운 진로 흐름 분석 (십신 × 12운성, 고전이론 응용) ===================== */
// 12운성: 양간은 장생 지지부터 순행, 음간은 장생 지지부터 역행 (전통 명리학 공개 산출식)
const STAGE_ORDER = ["장생","목욕","관대","건록","제왕","쇠","병","사","묘","절","태","양"];
const JANGSAENG_ARR = [11,6,2,9,2,9,5,0,8,3]; // 갑을병정무기경신임계 순서의 장생 지지 인덱스
function twelveStage(dayStemIdx, branchIdx){
  const isYang = (dayStemIdx%2===0);
  const js = JANGSAENG_ARR[dayStemIdx];
  const diff = isYang ? ((branchIdx-js+12)%12) : ((js-branchIdx+12)%12);
  return STAGE_ORDER[diff];
}
const STAGE_TIER = {
  "장생":"강","관대":"강","건록":"강","제왕":"강",
  "목욕":"보통","쇠":"보통","병":"보통",
  "사":"약","묘":"약","절":"약","태":"약","양":"약",
};

// 십신(十神) 세분화: 음양까지 비교하여 10가지로 분류 (전통 명리학 공개 이론)
function tenGod10(dayStemIdx, targetElem, targetEven){
  const dayElem = STEM_ELEM[dayStemIdx];
  const dayEven = (dayStemIdx%2===0); // 짝수 인덱스=양간/양지
  const same = (dayEven===targetEven);
  if(targetElem===dayElem) return same?"비견":"겁재";
  if(GENERATES[dayElem]===targetElem) return same?"식신":"상관";
  if(CONTROLS[dayElem]===targetElem) return same?"편재":"정재";
  if(CONTROLS[targetElem]===dayElem) return same?"편관":"정관";
  if(GENERATES[targetElem]===dayElem) return same?"편인":"정인";
}
const GROUP5 = {"비견":"비겁","겁재":"비겁","식신":"식상","상관":"식상","편재":"재성","정재":"재성","편관":"관성","정관":"관성","편인":"인성","정인":"인성"};
const TEN_GOD_DESC = {
  "비견":"동등한 위치에서의 협력, 자립심", "겁재":"경쟁심과 추진력, 리스크를 감수하는 승부욕",
  "식신":"여유롭고 안정적인 표현력, 꾸준한 창작·생산", "상관":"재기발랄하고 비판적인 창의력, 틀을 깨는 발상",
  "편재":"통 큰 자금 운용, 사업 확장과 유동적 자원관리", "정재":"계획적이고 성실한 자산관리, 안정적 수입",
  "편관":"강한 추진력과 위기대응력, 승부사 기질(칠살)", "정관":"원칙과 책임감, 조직에 대한 신뢰도 높은 적응력",
  "편인":"독창적 사고와 직관, 정형화되지 않은 학습법", "정인":"학구적이고 안정지향적인 학습, 보호받는 성장",
};
// 십신별 진로 성향 (사용자 정의 이론, 5대 분류 기준)
const CAREER_HINT = {
  "식상": "개인사업 (소규모 자영업·기술직 자영업)",
  "재성": "사업가 (재물을 직접 운용하는 사업 확장형)",
  "관성": "공무원·회사원 (조직·소속에 속한 안정형)",
  "인성": "교육 관련 분야 (연구·강의·자기계발 지원형)",
  "비겁": "독립·동업형 (본인 주도로 판을 짜는 유형)",
};
// 십신별 전공계열 힌트 (사용자 정의 이론, CAREER_HINT를 대학매칭 화면용으로 확장)
// ⚠ 절대적 기준이 아닌 참고용 성향입니다. 실제 전공 선택은 학생의 흥미·성적을 함께 고려해야 합니다.
const MAJOR_FIELD_HINT = {
  "식상": "손기술·표현력을 살리는 전공 (공학/기술계열, 예체능계열, 콘텐츠·미디어 관련 전공) — 무언가를 직접 만들고 표현하는 실전형 전공에서 강점이 드러나는 편입니다.",
  "재성": "돈과 자원의 흐름을 다루는 전공 (경영/경제/무역/회계 계열) — 자원을 굴리고 확장하는 감각이 필요한 전공에서 유리합니다.",
  "관성": "체계와 신뢰를 쌓는 전공 (행정/법정/사회과학 계열) — 조직의 규칙 안에서 꾸준히 인정받는 구조, 공무원·공기업 준비에도 유리한 전공입니다.",
  "인성": "배우고 가르치는 전공 (교육/인문/어문 계열, 연구직 지향 전공) — 지식을 쌓고 전달하는 학구적인 환경에서 편안함을 느끼는 편입니다.",
  "비겁": "자기주도형 전공 (경영학, 디자인, IT/창업 연계 전공) — 남 밑에서 정해진 틀을 따르기보다 스스로 판을 짜는 구조에 잘 맞는 전공입니다.",
};
// 오행 상생상극 관계만으로 일간 기준 십신 대분류(GROUP5)를 판정 (음양/정편 구분 없이 오행 단위로 판정할 때 사용)
function elementRelationGroup(dayElem, targetElem){
  if(targetElem === dayElem) return "비겁";
  if(GENERATES[targetElem] === dayElem) return "인성";   // target이 일간을 생함
  if(GENERATES[dayElem] === targetElem) return "식상";   // 일간이 target을 생함
  if(CONTROLS[dayElem] === targetElem) return "재성";    // 일간이 target을 극함
  if(CONTROLS[targetElem] === dayElem) return "관성";    // target이 일간을 극함
  return null;
}
/* 용신 오행을 기준으로 진로·전공 적성 해설문을 생성.
   대학매칭 화면(college-match-ui.js)에서 사용 — 대학 리스트만 나열하지 않고
   "왜 이 오행 대학군이 이 학생에게 힘이 되는가"를 사주코어의 기존 서술 로직(CAREER_HINT/
   buildOverviewNarrative와 동일한 패턴)으로 함께 보여주기 위한 함수. */
function buildCareerFieldNarrative(saju, ys){
  const dayElem = STEM_ELEM[saju.day.stem];
  const group5 = elementRelationGroup(dayElem, ys.yongsin);
  if(!group5) return null;
  const careerHint = CAREER_HINT[group5];
  const majorHint = MAJOR_FIELD_HINT[group5];
  const text = `일간 ${dayElem} 기준으로 용신인 ${ys.yongsin} 기운은 십신상 '${group5}'에 해당합니다. 진로 성향으로는 ${careerHint} 쪽에 힘이 실리며, 전공 계열로는 ${majorHint}`;
  return { group5, careerHint, majorHint, text };
}

function analyzeDaewoonCareer(saju, ys){
  const dayElem = STEM_ELEM[saju.day.stem];
  const rows = saju.daewoon.map(dw=>{
    const gz = gzFromIndex(dw.idx);
    const stemElem = STEM_ELEM[gz.stem];
    // 흐르는 운은 지지 기준 (2026.11.07 확정): 십신·용신 판정 모두 대운 지지의 오행으로
    const branchElem = BRANCH_ELEM[gz.branch];
    const god10 = tenGod10(saju.day.stem, branchElem, gz.branch%2===0);
    const group5 = GROUP5[god10];
    const stage = twelveStage(saju.day.stem, gz.branch); // 일간 기준 대운 지지의 12운성
    const tier = STAGE_TIER[stage];
    let alignment = "중립";
    if(branchElem===ys.yongsin || branchElem===ys.huisin) alignment = "길함(용신·희신 해당)";
    else if(branchElem===ys.gisin) alignment = "주의(병신 해당)";
    return { startAge:dw.startAge, gzText:`${STEMS[gz.stem]}${BRANCHES[gz.branch]}`, stemElem, branchElem, god10, group5, stage, tier, alignment, careerHint: CAREER_HINT[group5] };
  });

  // 기운이 가장 강한(=강 tier) 시기들 중 십신 비중이 가장 높은 것을 '타고난 큰 길'로 요약
  const strongRows = rows.filter(r=>r.tier==="강");
  const tally = {};
  strongRows.forEach(r=>{ tally[r.group5] = (tally[r.group5]||0)+1; });
  let mainPath = null;
  if(strongRows.length){
    const topGod = Object.keys(tally).sort((a,b)=>tally[b]-tally[a])[0];
    const periods = strongRows.filter(r=>r.group5===topGod).map(r=>`${r.startAge}세(${r.gzText})`);
    mainPath = { group5: topGod, careerHint: CAREER_HINT[topGod], periods };
  }
  return { rows, mainPath };
}

/* ===================== 세운 흐름 분석 (십신 × 12운성) ===================== */
function analyzeSewoonFlow(saju, ys, startYear, count){
  const rows = [];
  for(let i=0;i<count;i++){
    const yr = startYear + i;
    const age = yr - saju.birthYear + 1;
    const sy = ((yr-4)%60+60)%60;
    const stem = sy%10, branch = sy%12;
    const stemElem = STEM_ELEM[stem];
    // 흐르는 운은 지지 기준 (2026.11.07 확정)
    const branchElem = BRANCH_ELEM[branch];
    const god10 = tenGod10(saju.day.stem, branchElem, branch%2===0);
    const group5 = GROUP5[god10];
    const stage = twelveStage(saju.day.stem, branch);
    const tier = STAGE_TIER[stage];
    let alignment = "중립";
    if(branchElem===ys.yongsin || branchElem===ys.huisin) alignment = "길함(용신·희신)";
    else if(branchElem===ys.gisin) alignment = "주의(병신)";
    rows.push({ yr, age, stem, branch, gzText:`${STEMS[stem]}${BRANCHES[branch]}`, stemElem, branchElem, god10, group5, stage, tier, alignment });
  }
  return rows;
}

function buildYearNarrative(row, prevRow, ys){
  const tierText = { "강":"기운이 왕성한", "보통":"완만하게 흐르는", "약":"기운이 잦아드는" };
  let trend = "";
  if(prevRow){
    const order = ["약","보통","강"];
    const diff = order.indexOf(row.tier) - order.indexOf(prevRow.tier);
    if(diff>0) trend = `작년(${prevRow.gzText})보다 기운이 상승하는 흐름이며, `;
    else if(diff<0) trend = `작년(${prevRow.gzText})보다 기운이 가라앉는 흐름이며, `;
    else trend = `작년(${prevRow.gzText})과 비슷한 세력이 이어지며, `;
  }
  return `${row.yr}년(만 ${row.age}세)은 세운 ${row.gzText}년으로, 일간 기준 12운성은 '${row.stage}' — ${tierText[row.tier]} 시기입니다. ${trend}십신으로는 ${row.god10}(${row.group5})에 해당해 ${TEN_GOD_DESC[row.god10]} 성향이 두드러질 수 있습니다. 진로 관점에서는 ${CAREER_HINT[row.group5]} 쪽 기운이 함께 흐르며, 용신 구조상 ${row.alignment}에 해당합니다.`;
}

/* ===================== 사주 총평 해설 ===================== */
const ELEM_TRAIT = {
  "목":"성장과 확장을 지향하며 진취적이고 유연한",
  "화":"표현력과 열정이 강하고 밝고 적극적인",
  "토":"신뢰와 포용력이 있고 중심을 잡아주는 안정적인",
  "금":"원칙과 결단력이 뚜렷하고 맺고 끊음이 분명한",
  "수":"지혜와 유연성을 갖추고 상황에 잘 적응하는",
};
function buildOverviewNarrative(saju, ys){
  const dayElem = STEM_ELEM[saju.day.stem];
  const strongDesc = ys.isStrong
    ? "본인 스스로의 힘(비겁·인성)이 강한 신강 사주로, 주체적이고 자기 주도적인 경향이 두드러집니다."

}

/* ===================== 신살(神殺) 판정 (전통 명리학 공개 이론) ===================== */
// 천을귀인: 일간 기준 특정 지지가 있으면 성립 (갑무경-축미, 을기-자신, 병정-해유, 임계-묘사, 신-오인)
function cheoneulBranches(dayStemIdx){
  if([0,4,6].includes(dayStemIdx)) return [1,7];
  if([1,5].includes(dayStemIdx)) return [0,8];
  if([2,3].includes(dayStemIdx)) return [11,9];
  if([8,9].includes(dayStemIdx)) return [3,5];
  if(dayStemIdx===7) return [6,2];
}
// 삼합 그룹별 도화·역마·화개 (왕지=도화 기준 공개 산출식)
const SINSAL_BY_ELEM = {
  "목": {dohwa:0, yeokma:5, hwagae:7},
  "화": {dohwa:3, yeokma:8, hwagae:10},
  "금": {dohwa:6, yeokma:11, hwagae:1},
  "수": {dohwa:9, yeokma:2, hwagae:4},
};
function samhapGroupOfBranch(branchIdx){
  for(const def of SAMHAP){ if(def.branches.includes(branchIdx)) return def.elem; }
}
const GOEGANG_IDX = [16,28,34,46]; // 경진 임진 무술 경술
const YANGIN_MAP = {0:3, 2:6, 4:6, 6:9, 8:0}; // 갑->묘, 병/무->오, 경->유, 임->자 (양간만 해당)

function analyzeSinsal(saju, hasTime){
  const branches = [saju.year.branch, saju.month.branch, saju.day.branch];
  if(hasTime) branches.push(saju.hour.branch);
  const found = [];

  // 천을귀인
  const cheoneul = cheoneulBranches(saju.day.stem);
  if(cheoneul && cheoneul.some(b=>branches.includes(b))){
    found.push({ name:"천을귀인(天乙貴人)", desc:"어려운 상황에서 귀인의 도움을 받기 쉬운 대표적 길신입니다." });
  }
  // 도화/역마/화개 (일지 기준)
  const group = samhapGroupOfBranch(saju.day.branch);
  if(group){
    const t = SINSAL_BY_ELEM[group];
    if(branches.includes(t.dohwa)) found.push({ name:"도화살(桃花殺)", desc:"매력과 인기, 대인관계에서 주목받는 기운입니다. 이성 관련 구설로 이어지기도 합니다." });
    if(branches.includes(t.yeokma)) found.push({ name:"역마살(驛馬殺)", desc:"이동·변화가 잦고 타지·해외와 인연이 깊은 기운입니다." });
    if(branches.includes(t.hwagae)) found.push({ name:"화개살(華蓋殺)", desc:"예술·종교·학문 등 정신적 영역에 몰입하는 기운으로, 고독을 동반하기도 합니다." });
  }
  // 괴강살 (일주 기준)
  const dayIdx = findGZIndex(saju.day.stem, saju.day.branch);
  if(GOEGANG_IDX.includes(dayIdx)){
    found.push({ name:"괴강살(魁罡殺)", desc:"극단적인 총명함과 강한 카리스마를 지니지만 인생의 기복이 큰 편입니다." });
  }
  // 양인살 (일간 기준, 양간만 해당)
  if(YANGIN_MAP[saju.day.stem]!==undefined && branches.includes(YANGIN_MAP[saju.day.stem])){
    found.push({ name:"양인살(羊刃殺)", desc:"강한 추진력과 결단력, 날카로운 승부근성을 상징합니다. 과격함을 절제하는 것이 관건입니다." });
  }
  // 공망 (일주 순중공망)
  const groupStart = Math.floor(dayIdx/10)*10;
  const branchAtStart = groupStart%12;
  const gongmangBranches = [(branchAtStart+10)%12, (branchAtStart+11)%12];
  const gongmangHit = [saju.year.branch, saju.month.branch, hasTime?saju.hour.branch:null].filter(b=>b!==null && gongmangBranches.includes(b));
  if(gongmangHit.length){
    found.push({ name:"공망(空亡)", desc:`해당 지지(${gongmangHit.map(b=>BRANCHES[b]).join('·')})가 상징하는 자리의 기운이 공허해지기 쉬워, 집착보다 초연함이 필요한 영역입니다.` });
  }
  return found;
}

/* ===================== 십신 × 12운성 강도 결합 (통근 강도 분석) ===================== */
// 각 기둥의 천간이 '자기 자신의 기준'으로 자기 지지에서 몇 단계 12운성인지 계산 → 통근(뿌리) 강도
function analyzePillarStrength(saju, hasTime){
  const pillars = [
    { name:"년주", stem:saju.year.stem, branch:saju.year.branch, isDay:false },
    { name:"월주", stem:saju.month.stem, branch:saju.month.branch, isDay:false },
    { name:"일주", stem:saju.day.stem, branch:saju.day.branch, isDay:true },
  ];
  if(hasTime) pillars.push({ name:"시주", stem:saju.hour.stem, branch:saju.hour.branch, isDay:false });

  const rows = pillars.map(p=>{
    const stemElem = STEM_ELEM[p.stem];
    const god10 = p.isDay ? "일간(본인)" : tenGod10(saju.day.stem, stemElem, p.stem%2===0);
    const group5 = p.isDay ? "비겁" : GROUP5[god10];
    const stage = twelveStage(p.stem, p.branch); // 통근: 천간 자체 기준 12운성
    const tier = STAGE_TIER[stage];
    return { name:p.name, gzText:`${STEMS[p.stem]}${BRANCHES[p.branch]}`, god10, group5, stage, tier };
  });

  const scoreMap = {"강":2,"보통":1,"약":0};
  const groupScore = {"비겁":0,"식상":0,"재성":0,"관성":0,"인성":0};
  rows.forEach(r=>{ groupScore[r.group5]+=scoreMap[r.tier]; });
  const dominant = Object.keys(groupScore).sort((a,b)=>groupScore[b]-groupScore[a])[0];
  return { rows, groupScore, dominant };
}

<script>/* engine/saju-flow.js */
/* ============================================================
   saju-flow.js — 평생앱용 운의 흐름 계산 (대운·세운·월운)

     - 원국(태어난 사주, '나')은 일간 기준으로 본다. → saju-core 그대로
     - 흐르는 운(대운·세운·월운)의 십성과 4신 판정은 천간이 아니라 "지지" 기준으로 본다.

      const cur = pillarsOn(y, m, d);
      if (cur.month.branch !== prev.month.branch) {
        return { start: iso(y, m, d), stem: cur.month.stem, branch: cur.month.branch };

        sequenceNo: i + 1,
        startAge: Math.round(startAgeExact * 100) / 100,
        startAgeLabel: `만 ${Math.floor(startAgeExact)}세 ${Math.floor((startAgeExact % 1) * 12)}개월`,

        targetYear: y, targetMonth: m, startDate: cur.start, endDate: iso(e.y, e.m, e.d),

      isStrong: ys.isStrong,
      dayMaster: { stem: saju.day.stem, text: S.STEMS[saju.day.stem], elem: S.STEM_ELEM[saju.day.stem] },
      pillars,
      daewoon: daewoonRows(saju, ys, p.birthDate),
      sewoon: sewoonRows(saju, ys, asOf[0], opt.sewoonYears || 12),

  }

  /** 오늘 기준 현재 대운·세운·월운 한 줄씩 */
  function current(a, todayIso) {
    const t = todayIso || new Date().toISOString().slice(0, 10);
    const pick = rows => rows.find(r => r.startDate <= t && t <= r.endDate) || null;
    return { daewoon: pick(a.daewoon), sewoon: pick(a.sewoon), wolwoon: pick(a.wolwoon) };
  }

  return { ENGINE_VERSION, FLOW_VERSION, ROLE_LABEL, analyze, current, godRole, readBranch, ipchunDate, solarMonth };
});

<script>/* engine/life-stage.js */
/* ============================================================
   life-stage.js — 생애 단계 계산 (DB의 compute_stage()와 같은 규칙)
   규칙을 바꾸면 supabase/migrations 의 compute_stage()도 같이 고칠 것.

   BIRTH_NAMING : 출생일 ~ 백일 전날 (백일 = 출생일 + 99일, 태어난 날을 1일로 셈)
   INFANT       : 백일 ~ 유치원 입학일 전날 (유치원 입학 = 초등입학일 - 3년, 만3세반)
   KINDERGARTEN : 유치원 입학일 ~ 초등입학일 전날
   ELEMENTARY   : 초등입학일 ~ 6년 뒤 전날 (매년 3월 1일 학년 증가)
   FUTURE       : 그 이후 (서버 단계. 화면은 lifePath()로 중학교·고등학교·대학까지 이어서 보여 줌)
   초등입학일 기본값 = 출생연도 + 7년의 3월 1일 (1~12월생 같은 학년). 조기입학·유예는 부모가 수정.
   ============================================================ */
(function (root, factory) {

  if (typeof module !== 'undefined' && module.exports) module.exports = m;
})(typeof self !== 'undefined' ? self : this, function () {
  const RULE_VERSION = 'stage-rule-v1';
  const STAGES = {
    BIRTH_NAMING: { label: '출생·작명', short: '출생', order: 1 },
    INFANT: { label: '영유아', short: '영유아', order: 2 },
    KINDERGARTEN: { label: '유치원', short: '유치원', order: 3 },
    ELEMENTARY: { label: '초등학교', short: '초등', order: 4 },
    FUTURE: { label: '중학교 이후', short: '중등+', order: 5 },
  };
  const STAGE_MODULES = {
    BIRTH_NAMING: ['NAMING', 'VACCINE_GUIDE', 'INFANT_CHECKLIST'],
    INFANT: ['VACCINE_GUIDE', 'INFANT_CHECKLIST', 'DAYCARE_FINDER'],
    KINDERGARTEN: ['VACCINE_GUIDE', 'KINDER_FINDER', 'ACADEMY_GUIDE', 'ELEM_PREVIEW'],
    ELEMENTARY: ['ELEM_MATCH', 'ACADEMY_GUIDE'],

    const kinder = addYears(entry, -3);

      stage, grade, label: STAGES[stage].label + (grade ? ` ${grade}학년` : ''),

  const PATH = [

    const gradeFrom = start => Number(onIso.slice(0, 4)) - Number(start.slice(0, 4)) - (onIso.slice(5) < start.slice(5) ? 1 : 0) + 1;

    if (c.stage !== 'FUTURE') { phase = c.stage; label = STAGES[c.stage].label; grade = c.grade; }

    let idx = points.length - 1, frac = 0;

    }
    const pos = points.length > 1 ? (idx + frac) / (points.length - 1) * 100 : 0;
    const next = points.find(p => p.date > onIso) || null;
    return { phase, label, grade, points, pos, next, stage: c.stage };
  }
  return { RULE_VERSION, STAGES, STAGE_MODULES, compute, defaultElementaryEntry, lifePath };
});

  function renderHTML(r, opt = {}) {

</article>`;

  return { REPORT_VERSION, build, renderHTML, CSS, GROUP_TEXT, ROLE_TEXT };

<script>/* engine/cloud.js */
/* ============================================================

(function (root) {
  'use strict';
  const CONFIG = {
    url: 'https://ocinamrnkvnmfkkyguxx.supabase.co',
    key: 'sb_publishable_uQc4kRmXkGxQEeW1W9Yzzw_lvHZ9OtO',   // 공개용 키 (브라우저에 넣어도 되는 키)
    termsVersion: 'v2026.11.13',
  };
  const REQUIRED = ['TERMS', 'PRIVACY_COLLECT', 'CHILD_PROFILE'];
  const OPTIONAL = ['SAJU_ANALYSIS', 'MONTHLY_REPORT', 'KAKAO_ALIMTALK', 'MARKETING'];

  let sb = null, user = null;

    if (client) sb = client;

    if (!sb) return Promise.resolve(null);
    sb.auth.onAuthStateChange((_e, s) => { user = s ? s.user : null; emit(); });
    return sb.auth.getSession().then(({ data }) => { user = data.session ? data.session.user : null; emit(); return user; });
  }
  const onChange = f => listeners.push(f);
  const currentUser = () => user;

  function msg(err) {
    const m = (err && (err.message || err.error_description)) || String(err);
    if (/Invalid login credentials/i.test(m)) return '이메일 또는 비밀번호가 맞지 않아요.';

    if (/valid email|invalid format/i.test(m)) return '이메일 주소 형식을 확인해 주세요.';
    if (/Failed to fetch|NetworkError|network/i.test(m)) return '인터넷 연결을 확인해 주세요.';
    if (/rate limit/i.test(m)) return '잠시 후 다시 시도해 주세요.';
    return m;
  }
  async function signUp(email, password, parentName) {
    const { data, error } = await sb.auth.signUp({ email, password, options: { data: { display_name: parentName } } });
    if (error) throw new Error(msg(error));
    return { needsConfirm: !data.session };
  }

    const { error } = await sb.auth.signInWithPassword({ email, password });

  function fromServer(r) {
    const s = r.app_state || {};
    return {
      id: 's' + r.person_id, sid: r.person_id, familyId: r.family_id,
      name: r.display_name, birth: ymd(r.birth_date), time: hm(r.birth_time),
      gender: r.gender || 'F', entry: r.entry_date_override ? ymd(r.elementary_entry_date) : null,
      done: s.done || {}, dev: s.dev || {}, answers: s.answers || {}, insts: s.insts || [], notes: s.notes || [],
      syncedAt: r.state_updated_at || null,
    };
  }

  const profileOf = k => ({ name: k.name, birth: k.birth, time: k.time || '', gender: k.gender, entry: k.entry || null });

    const { data, error } = await sb.rpc('my_children');

    const cs = Array.from(new Set([...REQUIRED, ...(consents || []).filter(c => OPTIONAL.includes(c))]));
    const fam = await familyId();
    const args = { p_child_name: k.name, p_birth_date: k.birth, p_birth_time: k.time || null, p_gender: k.gender || null,
                   p_terms_version: CONFIG.termsVersion, p_consents: cs };
    const { data, error } = fam
      ? await sb.rpc('add_child', Object.assign({ p_family: fam }, args))
      : await sb.rpc('create_family_with_child', Object.assign({ p_family_name: (parentName || '우리') + ' 가족', p_parent_name: parentName || '보호자' }, args));

    const sid = data;
    if (k.entry) await updateProfile(Object.assign({}, k, { sid }));
    await saveState(Object.assign({}, k, { sid }));

    const row = { display_name: k.name, birth_date: k.birth, birth_time: k.time || null,

                  entry_date_override: !!k.entry };
    if (k.entry) row.elementary_entry_date = k.entry;
    const { error } = await sb.from('person').update(row).eq('id', k.sid);
    if (error) throw new Error(msg(error));
  }

  async function saveState(k) {
    const { error } = await sb.from('person_app_state').upsert({ person_id: k.sid, data: stateOf(k) }, { onConflict: 'person_id' });
    if (error) throw new Error(msg(error));
  }

  async function archive(sid) {
    const { error } = await sb.from('person').update({ profile_status: 'ARCHIVED' }).eq('id', sid);
    if (error) throw new Error(msg(error));
  }

  /* ---------- 한 번에 맞추기 ----------
     로컬 아이 목록과 서버를 합친다.
     - 서버에 없는 로컬 아이(예시 제외)는 서버에 새로 만든다
     - 로컬에서 고친 아이(dirty)는 서버에 올린다
     - 그 밖에는 서버 내용을 따른다 (다른 기기에서 고친 것 반영) */
  async function sync(localKids, consents, parentName) {
    const server = await pull();
    const bySid = new Map(server.map(k => [k.sid, k]));
    const out = [];
    for (const k of localKids) {
      if (k.example) continue;
      if (!k.sid) {
        const sid = await createKid(k, consents, parentName);
        out.push(Object.assign({}, k, { sid, dirty: false, profileDirty: false }));
        continue;
      }
      const s = bySid.get(k.sid);
      if (!s) continue;                       // 다른 기기에서 삭제됨
      bySid.delete(k.sid);
      if (k.profileDirty) await updateProfile(k);
      if (k.dirty) await saveState(k);
      out.push(k.dirty || k.profileDirty
        ? Object.assign({}, k, { dirty: false, profileDirty: false })
        : Object.assign({}, s, { id: k.id }));
    }
    for (const s of bySid.values()) out.push(s);   // 다른 기기에서 추가된 아이
    return out;
  }

  root.CompassCloud = { CONFIG, REQUIRED, OPTIONAL, init, available, onChange, currentUser,
                        signUp, signIn, signOut, pull, createKid, updateProfile, saveState, archive, sync, profileOf, stateOf };
  if (typeof module !== 'undefined' && module.exports) module.exports = root.CompassCloud;
})(typeof window !== 'undefined' ? window : globalThis);

      <label class="fld">비밀번호 (6자 이상)<input id="su-pw" type="password" autocomplete="new-password" minlength="6" required></label>
      <div class="consent"><span class="label">보호자 동의</span>
        <label><input type="checkbox" id="c-all"> 아래 항목에 모두 동의</label>
        <label><input type="checkbox" class="c-req" value="TERMS" required> (필수) 이용약관</label>
        <label><input type="checkbox" class="c-req" value="PRIVACY_COLLECT" required> (필수) 개인정보 수집·이용</label>
        <label><input type="checkbox" class="c-req" value="CHILD_PROFILE" required> (필수) 만 14세 미만 자녀 정보 등록 (법정대리인 동의)</label>
        <label><input type="checkbox" class="c-opt" value="SAJU_ANALYSIS"> (선택) 태어난 날 기반 성향·흐름 분석</label>
        <label><input type="checkbox" class="c-opt" value="MONTHLY_REPORT"> (선택) 월간 성장 리포트 받기</label>
        <label><input type="checkbox" class="c-opt" value="MARKETING"> (선택) 새 소식·혜택 안내</label></div>
      <button class="btn primary">가입하고 저장하기</button></form>
    </div></section>`;
}
function render(){
  renderTop(); const k=kid();
  const v={today:viewToday,grow:viewGrow,trait:viewTrait,inst:viewInst,report:viewReport,flow:viewFlow,apps:viewApps,kid:viewKid,account:viewAccount}[state.tab]||viewToday;
  let html; try{ html=v(k); }catch(e){ html=`<div class="empty">이 화면을 그리지 못했어요: ${esc(e.message)}</div>`; }
  $('#app').innerHTML = html + `<footer>컴패스랩 · 운영 와이튜브 · 사주 계산 엔진 ${S.ENGINE_VERSION||''} · 성향과 운은 참고용이며 진단이 아닙니다.</footer>`;
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click', e=>{
  if(e.target.closest('[data-logout]')){ C.signOut().then(()=>{ toast('로그아웃했어요'); render(); }); return; }
  if(e.target.closest('[data-sync]')){ doSync(); return; }
  const t=e.target.closest('[data-kid],[data-addkid],[data-tab],[data-filter],[data-mark],[data-delinst],[data-delkid],[data-ym],[data-period],[data-delnote]'); if(!t) return;
  if('period' in t.dataset){ state.period = (t.dataset.period && state.period!==t.dataset.period) ? t.dataset.period : ''; state.tab='today'; save(); render(); document.querySelector('.period,.hero-card')?.scrollIntoView({block:'start',behavior:'smooth'}); return; }
  if(t.dataset.delnote){ const k=kid(); k.notes=(k.notes||[]).filter(n=>n.id!==t.dataset.delnote); toast('기록을 삭제했어요'); save(); render(); return; }
  if(t.dataset.ym){ state.reportYm=t.dataset.ym; }
  else if(t.dataset.kid){ state.cur=t.dataset.kid; state.period=''; }
  else if('addkid' in t.dataset){ const id='k'+Date.now(); state.kids.push({id,name:'새 아이',birth:todayIso(),time:'',gender:'F',entry:null,done:{},dev:{},answers:{},insts:[]}); state.cur=id; state.tab='kid'; }
  else if(t.dataset.tab){ state.tab=t.dataset.tab; }
  else if(t.dataset.filter){ state.filter=t.dataset.filter; }
  else if(t.dataset.mark){ const [iid,id,c]=t.dataset.mark.split('|'); const inst=kid().insts.find(x=>x.id===iid); inst.marks[id] = inst.marks[id]===c ? '' : c; }
  else if(t.dataset.delinst){ const k=kid(); k.insts=k.insts.filter(x=>x.id!==t.dataset.delinst); toast('기관을 삭제했어요'); }
  else if('delkid' in t.dataset){ const gone=kid(); if(gone.sid&&C&&C.currentUser()) C.archive(gone.sid).catch(err=>toast(err.message)); state.kids=state.kids.filter(x=>x.id!==state.cur); state.cur=state.kids[0].id; state.tab='today'; toast('삭제했어요'); }
  save(); render(); if(t.dataset.tab) window.scrollTo({top:0});
});
document.addEventListener('change', e=>{
  const t=e.target, k=kid();
  if(t.dataset.task){ if(t.checked) k.done[t.dataset.task]=todayIso(); else delete k.done[t.dataset.task]; }
  else if(t.dataset.dev){ if(t.checked) k.dev[t.dataset.dev]=todayIso(); else delete k.dev[t.dataset.dev]; }
  else if(t.dataset.q){ k.answers[t.dataset.q]=Number(t.value); save(); const y=window.scrollY; render(); window.scrollTo({top:y}); return; }
  else if(t.dataset.memo){ k.insts.find(x=>x.id===t.dataset.memo).memo=t.value; save(); return; }
  else if(t.id==='smToggle'){ state.simmyeong=t.checked; }
  else if(t.id==='c-all'){ document.querySelectorAll('.c-req,.c-opt').forEach(x=>x.checked=t.checked); return; }
  else return;
  save(); render();
});
document.addEventListener('submit', e=>{
  e.preventDefault(); const k=kid();
  if(e.target.id==='loginForm'||e.target.id==='signupForm'){ authSubmit(e.target); return; }
  if(e.target.id==='noteForm'){ const text=$('#n-text').value.trim(); if(!text) return;
    (k.notes=k.notes||[]).push({id:'n'+Date.now(), date:$('#n-date').value||todayIso(), cat:$('#n-cat').value, text});
    toast('기록했어요'); save(); render(); return; }
  if(e.target.id==='addInst'){ const n=$('#instName').value.trim(); if(!n) return; (k.insts=k.insts||[]).push({id:'i'+Date.now(),name:n,kind:$('#instKind').value,marks:{},memo:''}); toast(`${n}을(를) 추가했어요`); }
  if(e.target.id==='kidForm'){
    const birth=$('#f-birth').value; if(!birth){ toast('생년월일을 넣어 주세요'); return; }
    if(birth>todayIso()){ toast('생년월일이 오늘보다 늦어요. 날짜를 확인해 주세요'); return; }
    const def=L.defaultElementaryEntry(birth), y=Number(def.slice(0,4)), ent=$('#f-entry').value;
    Object.assign(k,{name:$('#f-name').value.trim()||'우리 아이',birth,time:$('#f-time').value||'',gender:$('#f-gender').value,entry: ent==='early'?`${y-1}-03-01`:ent==='late'?`${y+1}-03-01`:null});
    if(k.example){ k.example=false; k.id='k'+Date.now(); state.cur=k.id; k.done={}; k.dev={}; k.answers={}; k.insts=[]; }
    state.tab='today'; toast('저장했어요');
  }
  save(); render();
});
async function authSubmit(f){
  const btn=f.querySelector('button'); btn.disabled=true; cloud.error='';
  try{
    if(f.id==='loginForm'){ await C.signIn($('#li-email').value.trim(), $('#li-pw').value); toast('로그인했어요'); }
    else{
      const req=[...document.querySelectorAll('.c-req')]; if(req.some(x=>!x.checked)){ throw new Error('필수 동의 3가지에 체크해 주세요.'); }
      state.consents=[...document.querySelectorAll('.c-req:checked,.c-opt:checked')].map(x=>x.value);
      state.parentName=$('#su-name').value.trim();
      const r=await C.signUp($('#su-email').value.trim(), $('#su-pw').value, state.parentName);
      try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
      if(r.needsConfirm){ cloud.error='가입 확인 메일을 보냈어요. 메일의 링크를 누른 뒤 여기서 로그인해 주세요.'; }
      else toast('가입했어요');
    }
  }catch(err){ cloud.error=err.message; }
  btn.disabled=false; render();
}
if(C){ C.onChange(u=>{ if(u){ state.tab=state.tab==='account'?'today':state.tab; doSync(); } else { cloud.status='off'; render(); } }); C.init().catch(()=>{}); }
try{ const st=document.createElement('style'); st.textContent=window.MonthlyReport.CSS; document.head.appendChild(st); }catch(e){}
render();
})();
</script>
